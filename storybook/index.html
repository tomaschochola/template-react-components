<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />

        <title>React Components</title>

        <meta
            name="description"
            content="React component library template with TypeScript, Webpack, Playwright, and a component workbench."

        <meta

        <meta
